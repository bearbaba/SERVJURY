name: SERVJURY quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source syntax
        run: |
          node --check agent/openserv-agent.mjs
          node --check src/openserv-bridge.mjs
          node --check src/genlayer.mjs
          node --check demo/server.mjs
      - name: Run isolated deterministic tests
        run: npm run check
      - name: No credentials in tracked files
        run: |
          test ! -f .env
          test ! -f .openserv.json

  partner-sdk-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documented OpenServ and GenLayer SDK packages
        run: npm install --no-fund --no-audit --ignore-scripts
      - name: Verify actual package exports without credentials
        run: |
          node --input-type=module -e "import { Agent, run } from '@openserv-labs/sdk'; import { provision, triggers } from '@openserv-labs/client'; if (![Agent,run,provision,triggers.webhook].every(x => typeof x === 'function')) process.exit(1)"
          node --input-type=module -e "import { createClient, createAccount, isSuccessful } from 'genlayer-js'; import { studionet } from 'genlayer-js/chains'; if (![createClient,createAccount,isSuccessful].every(x => typeof x === 'function') || !studionet) process.exit(1)"
