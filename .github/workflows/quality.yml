name: SERVJURY quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source syntax
        run: |
          node --check agent/openserv-agent.mjs
          node --check scripts/run-openserv-task.mjs
          node --check src/openserv-bridge.mjs
          node --check src/genlayer.mjs
          node --check demo/server.mjs
      - name: Run isolated deterministic tests
        run: npm run check
      - name: Smoke-test OpenServ task launcher in dry-run mode
        run: npm run task:openserv
      - name: No credentials in tracked files
        run: |
          test ! -f .env
          test ! -f .openserv.json

  partner-sdk-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documented OpenServ and GenLayer SDK packages
        run: npm install --no-fund --no-audit --ignore-scripts
      - name: Show installed SDK versions
        run: npm ls @openserv-labs/sdk @openserv-labs/client genlayer-js zod --depth=0
      - name: Read existing finalized SERVJURY case from Studionet (read-only)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/studionet-preflight.mjs
      - name: Compare stable GenLayer SDK read against hosted Studionet
        timeout-minutes: 3
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/servjury-stable-probe
          cp scripts/studionet-preflight.mjs /tmp/servjury-stable-probe/probe.mjs
          npm install --prefix /tmp/servjury-stable-probe --no-audit --no-fund genlayer-js@1.1.8
          node /tmp/servjury-stable-probe/probe.mjs
      - name: Verify actual package exports without credentials
        run: |
          node --input-type=module -e "import { Agent, run } from '@openserv-labs/sdk'; import { provision, triggers } from '@openserv-labs/client'; if (![Agent,run,provision,triggers.webhook].every(x => typeof x === 'function')) process.exit(1)"
          node --input-type=module -e "import { createClient, createAccount } from 'genlayer-js'; import { studionet } from 'genlayer-js/chains'; const client = createClient({chain:studionet,account:createAccount('0x'+'11'.repeat(32))}); for (const name of ['readContract','writeContract','waitForFinalization','estimateTransactionFeesForWrite']) if (typeof client[name] !== 'function') throw Error('Missing SDK method: '+name)"
