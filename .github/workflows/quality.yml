name: SERVJURY quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check source syntax
        run: |
          node --check agent/openserv-agent.mjs
          node --check src/openserv-agent-readiness.mjs
          node --check src/openserv-profiles.mjs
          node --check scripts/openserv-e2e-preflight.mjs
          node --check scripts/audit-openserv-e2e-readonly.mjs
          node --check src/openserv-e2e-audit.mjs
          node --check scripts/discover-genlayer-case-txs.mjs
          node --check scripts/run-openserv-task.mjs
          node --check src/openserv-verified-completion.mjs
          node --check scripts/run-openserv-task.mjs
          node --check src/openserv-bridge.mjs
          node --check src/genlayer.mjs
          node --check scripts/diagnose-studionet-wait-readonly.mjs
          node --check demo/server.mjs
      - name: Run isolated deterministic tests
        run: npm run check
      - name: Smoke-test OpenServ task launcher in dry-run mode
        run: npm run task:openserv
      - name: No credentials in tracked files
        run: |
          test ! -f .env
          test ! -f .openserv.json

  partner-sdk-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documented OpenServ and GenLayer SDK packages
        run: npm install --no-fund --no-audit --ignore-scripts
      - name: Audit production dependencies for High/Critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Show installed SDK versions
        run: npm ls @openserv-labs/sdk @openserv-labs/client genlayer-js zod --depth=0
      - name: Read existing finalized SERVJURY case from Studionet (read-only)
        timeout-minutes: 2
        run: node scripts/studionet-preflight.mjs
      - name: Calibrate absent GenLayer case on live RPC (no signatures)
        timeout-minutes: 2
        run: node scripts/studionet-unknown-case-preflight.mjs
      - name: Audit historic numeric OpenServ task cases on Studionet (read-only)
        timeout-minutes: 2
        run: npm run task:chain
      - name: Inspect first authenticated GenLayer file_case TX without signing
        timeout-minutes: 2
        run: npm run tx:inspect
      - name: Inspect second historical case TX without signing
        timeout-minutes: 2
        env:
          SERVJURY_INSPECT_TX_HASH: '0xfaf3cb1fc7bc95e81c9e6950ceeee8ee640aaeb3010ab6a4c2ec6a2612c50406'
        run: npm run tx:inspect
      - name: Find adjudicate_case TX via public contract history if supported
        timeout-minutes: 2
        run: npm run tx:history
      - name: Audit current authenticated E2E case TX history (read-only, never signs)
        timeout-minutes: 2
        env:
          OPENSERV_WORKFLOW_ID: '14062'
          OPENSERV_TASK_ID: '750592'
        run: npm run tx:history
      - name: Diagnose original V2 file_case SDK wait against public finalized receipt (read-only)
        timeout-minutes: 2
        run: node scripts/diagnose-studionet-wait-readonly.mjs
      - name: Verify actual package exports without credentials
        run: |
          node --input-type=module -e "import { Agent, run } from '@openserv-labs/sdk'; import { provision, triggers } from '@openserv-labs/client'; if (![Agent,run,provision,triggers.webhook].every(x => typeof x === 'function')) process.exit(1)"
          node --input-type=module -e "import { createClient, createAccount } from 'genlayer-js'; import { studionet } from 'genlayer-js/chains'; import { TransactionStatus } from 'genlayer-js/types'; const client = createClient({chain:studionet,account:createAccount('0x'+'11'.repeat(32))}); for (const name of ['readContract','writeContract','waitForTransactionReceipt']) if (typeof client[name] !== 'function') throw Error('Missing stable SDK method: '+name); if (!TransactionStatus.FINALIZED) throw Error('Missing FINALIZED enum')"
